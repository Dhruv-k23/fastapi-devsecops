name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install -r requirements.txt


    - name: Run lint (flake8)
      
      run: flake8 app/ --max-line-length=100 --ignore=E501

    - name: Run tests
      run: PYTHONPATH=. pytest

    - name: Run security scan (Bandit)
      run: bandit -r app/

    - name: Secret Scan
      uses: trufflesecurity/trufflehog@main
      with:
        path: .
        fail: true
